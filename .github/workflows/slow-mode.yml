name: slow-mode

on:
  pull_request:
    paths:
      - "codex-rs/slow-mode/**"
      - "codex-rs/core/src/client.rs"
      - "codex-rs/core/src/client_common.rs"
      - "codex-rs/core/src/session/**"
      - "codex-rs/tui/src/slash_command.rs"
      - "codex-rs/tui/src/chatwidget/slash_dispatch.rs"
      - ".github/workflows/slow-mode.yml"
  workflow_dispatch:
  push:
    tags:
      - "slow-mode-v*"

jobs:
  test:
    name: slow-mode tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Test the pacer
        working-directory: codex-rs
        run: cargo test -p codex-slow-mode

  release:
    name: codex-slow ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/slow-mode-v')
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: codex-slow-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: codex-slow-x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: codex-slow-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: codex-slow-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codex-slow-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Build a separate codex-slow binary
        working-directory: codex-rs
        run: cargo build -p codex-cli --release --bin codex --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="codex-rs/target/${{ matrix.target }}/release/codex"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            bin="${bin}.exe"
          fi
          cp "$bin" "${{ matrix.artifact }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
